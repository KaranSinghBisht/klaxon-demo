name: klaxon — Ledger-protected secret
on: { workflow_dispatch: {} }

permissions:
  id-token: write   # KLAXON binds the release to this workflow's OIDC identity
  contents: read

jobs:
  # The protected job needs one thing at runtime: the Ledger Key Ring SDK. It is resolved HERE, in
  # a job that holds no secret, from a package.json that describes only the action's own runtime
  # and deliberately does not depend on the application's tree — so nothing a compromised
  # application dependency can reach is ever carried into the job that holds the plaintext.
  # --ignore-scripts because a dependency of the release path has no business running install hooks.
  action-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with: { node-version: "24" }
      - name: Resolve the Key Ring SDK (no application dependencies, no install scripts)
        run: npm install --prefix .github/actions/klaxon-get --ignore-scripts --no-audit --no-fund
      - name: Pack it
        run: tar -czf action-deps.tgz .github/actions/klaxon-get/node_modules
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with: { name: action-deps, path: action-deps.tgz, retention-days: "1" }

  deploy:
    needs: action-deps
    runs-on: ubuntu-latest
    environment: production
    env:
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with: { name: action-deps }
      - name: Unpack the Key Ring SDK
        run: tar -xzf action-deps.tgz
      - uses: foundry-rs/foundry-toolchain@8f1998e9878d786675189ef566a2e4bf24869773
      - name: Release the deployer key from KLAXON
        id: klaxon
        uses: ./.github/actions/klaxon-get
        with:
          secret: DEPLOYER_PRIVATE_KEY
          witness: https://44-198-37-65.sslip.io
          member: ${{ secrets.KLAXON_MEMBER }}
          pay-account: "0.0.10455753"
          pay-key: ${{ secrets.KLAXON_PAY_KEY }}
      # The released plaintext reaches exactly one step, as its env. Note what this does NOT claim:
      # GitHub step outputs are readable by any later step in the same job, so "one step" is a
      # property of the workflow the operator writes, not something the witness can enforce.
      - name: Deploy the treasury
        run: forge script script/DeployDemoToken.s.sol --rpc-url sepolia --broadcast
        env:
          DEPLOYER_PRIVATE_KEY: ${{ steps.klaxon.outputs.value }}
